<!DOCTYPE html>
<html>
<head>
    <title>Student Login Page</title>
</head>

<body>

<center>
<h1><u>STUDENT LOGIN PAGE</u></h1>
</center>

<hr><br><br>

<form>

<table align="center" cellpadding="8">

<tr>
<td><b>Username :</b></td>
<td><input type="text" size="30" placeholder="Enter Username"></td>
</tr>

<tr>
<td><b>Password :</b></td>
<td><input type="password" size="30" placeholder="Enter Password"></td>
</tr>

<tr>
<td><b>Email :</b></td>
<td><input type="email" size="30" placeholder="Enter Email"></td>
</tr>

<tr>
<td><b>Mobile :</b></td>
<td><input type="tel" size="30" placeholder="Enter Mobile Number"></td>
</tr>

<tr>
<td><b>Remember Me</b></td>
<td><input type="checkbox"> Yes</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Login">
<input type="reset" value="Reset">
</td>
</tr>

<tr>
<td colspan="2" align="center">
New User? <a href="cv.html">Register Here</a>
</td>
</tr>

</table>

</form>

</body>
</html>
